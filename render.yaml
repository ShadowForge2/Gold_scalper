services:
  - type: web
    name: gold-scalper
    runtime: python
    buildCommand: cd Backend && bash render-build.sh
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BROKER
        value: CAPITAL
      - key: CAPITAL_API_KEY
        sync: false
      - key: CAPITAL_IDENTIFIER
        sync: false
      - key: CAPITAL_PASSWORD
        sync: false
      - key: CAPITAL_DEMO
        value: "true"
      - key: CAPITAL_EPIC
        value: GOLD
      - key: SYMBOL
        value: XAUUSD
      - key: MAGIC_NUMBER
        value: "123456"
      - key: COMMENT
        value: Gold Scalper
      - key: LOT_SIZE
        value: "0.01"
      - key: MIN_LOT
        value: "0.01"
      - key: MAX_LOT
        value: "9999.00"
      - key: LOT_STEP
        value: "0.01"
      - key: LOT_MULTIPLIER
        value: "2"
      - key: MAX_LOT_MULTIPLIER
        value: "2"
      - key: SIGNAL_TIMEFRAME
        value: "1"
      - key: MAX_DAILY_LOSS_USD
        value: "10.00"
      - key: MAX_EVENT_LOSS_USD
        value: "20.00"
      - key: SL_ATR_MULTIPLIER
        value: "1.0"
      - key: TP1_MULTIPLIER
        value: "2.0"
      - key: MAX_SPREAD_PIPS
        value: "50.0"
      - key: MAX_SPREAD_PIPS_XAUUSD
        value: "35.0"
      - key: MAX_DRIFT_XAUUSD
        value: "0.50"
      - key: MAX_DRIFT_US100
        value: "5.00"
      - key: MAX_DRIFT_JP225
        value: "10.00"
      - key: MAX_DRIFT_DE40
        value: "5.00"
      - key: MAX_DRIFT_US500
        value: "1.50"
      - key: MAX_DRIFT_US30
        value: "10.00"
      - key: MAX_SLIPPAGE_PIPS
        value: "10"
      - key: FRIDAY_CLOSE_BLOCK_MIN
        value: "60"
      - key: MIN_BALANCE
        value: "10.0"
      # ── Pull-into-H1 scalper — LIVE (daily profit bot) ──
      # The ONLY strategy that survived honest backtests (bar-close fills +
      # real costs from the start). Pull owns its symbols (momentum disabled
      # there), the session filter is bypassed for pull signals
      # (trades freely like the backtest), and the daily guards lock in a
      # good day / stop the bleed (R in entry-H1-ATR units, UTC rollover).
      # Live on the 3 pairs that survived OOS 2026 at PF >= 1.3:
      #   US30   pull .3 / trail .35 / hold 24  PF train 1.73 valid 1.83 OOS 1.81
      #   XAUUSD pull .3 / trail .15 / hold 12  PF train 1.22 valid 1.96 OOS 1.40
      #   US100  pull .3 / trail .50 / hold 6   PF train 1.38 valid 1.86 OOS 1.34
      # Never trade these pairs with the pull strategy (sweep: they fail under
      # realistic fills). Excluded from the scan universe + no entry engine.
      - key: BLACKLIST_SYMBOLS
        value: "DE40,JP225,US500"
      - key: PULL_XAUUSD
        value: "true"
      - key: PULL_US100
        value: "true"
      - key: PULL_US30
        value: "true"
      - key: PULL_PULL_R_XAUUSD
        value: "0.30"
      - key: PULL_TRAIL_R_XAUUSD
        value: "0.15"
      - key: PULL_MAX_HOLD_XAUUSD
        value: "12"
      - key: PULL_PULL_R_US100
        value: "0.30"
      - key: PULL_TRAIL_R_US100
        value: "0.50"
      - key: PULL_MAX_HOLD_US100
        value: "6"
      - key: PULL_PULL_R_US30
        value: "0.30"
      - key: PULL_TRAIL_R_US30
        value: "0.35"
      - key: PULL_MAX_HOLD_US30
        value: "24"
      - key: PULL_DAILY_TARGET_R_US30
        value: "0.0"
      - key: PULL_DAILY_MAX_LOSS_R_US30
        value: "0.0"
      - key: PULL_GIVEBACK_CAP
        value: "0.30"
      - key: PULL_PUMP_ATR
        value: "0.5"
      - key: PULL_BIG_ALIGN_ENABLED
        value: "true"
      - key: PULL_BIG_ALIGN_XAUUSD_MULT
        value: "1.0"
      - key: PULL_BIG_ALIGN_US100_MULT
        value: "1.0"
      - key: PULL_BIG_ALIGN_US30_MULT
        value: "1.0"
      - key: RISK_PCT
        value: "0.10"
      - key: PULL_AUTO_TUNE_ENABLED
        value: "true"
      - key: PULL_AUTO_TUNE_BARS_M5
        value: "600"
      - key: PULL_AUTO_TUNE_TTL_SEC
        value: "21600"
      - key: USD_TO_NGN_RATE
        value: "1500"
      - key: PAYSTACK_SECRET_KEY
        sync: false
      # ── Email (Resend) ──
      # Multiple keys allowed as a comma-separated list; sends rotate
      # round-robin and fail over to the next key on rate-limit/server errors.
      - key: RESEND_API_KEYS
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "QuantoraFX <onboarding@resend.dev>"
      # Public base URL of this deployment — used to build the logo URL
      # (/static/logo.png) referenced inside every email. Override with a
      # BRAND_LOGO_URL env var for a fully external logo.
      - key: PUBLIC_BASE_URL
        value: "https://gold-scalper-qyhg.onrender.com"
      - key: DATABASE_URL
        sync: false
      - key: FAILOVER_ENABLED
        value: "true"
      - key: FAILOVER_ROLE
        value: "primary"
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: PYTHONMALLOC
        value: "malloc"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: MALLOC_TRIM_THRESHOLD
        value: "65536"
      - key: CORS_ORIGINS
        value: https://gold-scalper-qyhg.onrender.com
