services:
  - type: web
    name: gold-scalper
    runtime: python
    buildCommand: bash render-build.sh
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BROKER
        value: CAPITAL
      - key: CAPITAL_API_KEY
        sync: false
      - key: CAPITAL_IDENTIFIER
        sync: false
      - key: CAPITAL_PASSWORD
        sync: false
      - key: CAPITAL_DEMO
        value: "true"
      - key: CAPITAL_EPIC
        value: GOLD
      - key: SYMBOL
        value: XAUUSD
      - key: MAGIC_NUMBER
        value: "123456"
      - key: COMMENT
        value: Gold Scalper
      - key: LOT_SIZE
        value: "0.01"
      - key: MIN_LOT
        value: "0.01"
      - key: MAX_LOT
        value: "9999.00"
      - key: LOT_STEP
        value: "0.01"
      - key: LOT_MULTIPLIER
        value: "2"
      - key: MAX_LOT_MULTIPLIER
        value: "2"
      - key: SIGNAL_TIMEFRAME
        value: "1"
      - key: MAX_DAILY_LOSS_USD
        value: "10.00"
