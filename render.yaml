services:
  - type: web
    name: gold-scalper
    runtime: python
    buildCommand: bash render-build.sh
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BROKER
        value: CAPITAL
      - key: CAPITAL_API_KEY
        sync: false
      - key: CAPITAL_IDENTIFIER
        sync: false
      - key: CAPITAL_PASSWORD
        sync: false
      - key: CAPITAL_DEMO
        value: "true"
      - key: CAPITAL_EPIC
        value: GOLD
      - key: SYMBOL
        value: XAUUSD
      - key: MAGIC_NUMBER
        value: "123456"
      - key: COMMENT
        value: Gold Scalper
      - key: LOT_SIZE
        value: "0.01"
      - key: MIN_LOT
        value: "0.01"
      - key: MAX_LOT
        value: "9999.00"
      - key: LOT_STEP
        value: "0.01"
      - key: LOT_MULTIPLIER
        value: "2"
      - key: MAX_LOT_MULTIPLIER
        value: "2"
      - key: SIGNAL_TIMEFRAME
        value: "1"
      - key: MAX_DAILY_LOSS_USD
        value: "10.00"
      - key: MAX_EVENT_LOSS_USD
        value: "20.00"
      - key: MAX_TRADES_PER_EVENT
        value: "10"
      - key: MAX_TRADES_PER_SESSION
        value: "10"
      - key: MAX_CONSECUTIVE_LOSSES
        value: "5"
      - key: RE_ENTRY_COOLDOWN_SEC
        value: "60"
      - key: BIAS_UPDATE_INTERVAL_SEC
        value: "60"
      - key: SIGNAL_ENTRY_THRESHOLD
        value: "0.10"
      - key: SL_ATR_MULTIPLIER
        value: "1.0"
      - key: TP1_MULTIPLIER
        value: "2.0"
      - key: TP2_MULTIPLIER
        value: "4.0"
      - key: TP3_MULTIPLIER
        value: "6.0"
      - key: ATR_MULTIPLIER
        value: "1.0"
      - key: TP_CLOSE_THRESHOLD
        value: "0.8"
      - key: TP_CLOSE_MOMENTUM_MIN
        value: "0.25"
      - key: EXIT_THRESHOLD_TIGHT
        value: "0.60"
      - key: MAX_SPREAD_PIPS
        value: "50.0"
      - key: MAX_SPREAD_PIPS_XAUUSD
        value: "35.0"
      - key: MAX_DRIFT_XAUUSD
        value: "0.50"
      - key: MAX_DRIFT_US100
        value: "5.00"
      - key: MAX_DRIFT_JP225
        value: "10.00"
      - key: MAX_DRIFT_DE40
        value: "5.00"
      - key: MAX_DRIFT_US500
        value: "1.50"
      - key: MAX_DRIFT_US30
        value: "10.00"
      - key: MAX_SLIPPAGE_PIPS
        value: "10"
      - key: CANDLE_ML_TRAILING_ENABLED
        value: "true"
      - key: CANDLE_ML_TRAIL_ATR
        value: "1.5"
      - key: CANDLE_ML_PEAK_RETRACE_ENABLED
        value: "true"
      - key: CANDLE_ML_PEAK_RETRACE_FRAC
        value: "0.3"
      - key: CANDLE_ML_FLIP_EXIT_ENABLED
        value: "true"
      - key: CANDLE_ML_FLIP_LOSS_ATR
        value: "0.25"
      - key: CANDLE_ML_FLIP_CONSECUTIVE
        value: "2"
      - key: CANDLE_ML_FLIP_CONF
        value: "0.70"
      - key: FRIDAY_CLOSE_BLOCK_MIN
        value: "60"
      - key: MIN_BALANCE
        value: "10.0"
      - key: MIN_VOLATILITY_PIPS
        value: "5.0"
      - key: MAX_VOLATILITY_PIPS
        value: "200.0"
      - key: ALLOWED_SESSIONS
        value: ASIA,LONDON,NEW_YORK
      - key: SESSIONS_XAUUSD
        value: ASIA,LONDON,NEW_YORK
      - key: SESSIONS_US100
        value: LONDON,NEW_YORK
      - key: SESSIONS_JP225
        value: ASIA
      - key: SESSIONS_DE40
        value: LONDON
      - key: SESSIONS_US500
        value: LONDON,NEW_YORK
      - key: SESSIONS_US30
        value: LONDON,NEW_YORK
      - key: PEAK_HARVEST_TRAIL_TRIGGER
        value: "3.0"
      - key: PEAK_HARVEST_TRAIL_RETRACE
        value: "0.60"
      - key: PEAK_HARVEST_MIN_BARS_EXIT
        value: "15"
      - key: PEAK_HARVEST_MOMENTUM_THRESHOLD
        value: "0.90"
      - key: PEAK_HARVEST_MAX_HOLD_BARS
        value: "48"
      - key: MOMENTUM_US100
        value: "false"
      - key: MOMENTUM_JP225
        value: "false"
      - key: MOMENTUM_DE40
        value: "false"
      - key: MOMENTUM_XAUUSD
        value: "false"
      - key: MOMENTUM_US500
        value: "false"
      - key: MOMENTUM_US30
        value: "false"
      - key: MOMENTUM_MZ_MIN
        value: "2.0"
      - key: MOMENTUM_BODY_RATIO_MIN
        value: "0.60"
      - key: MOMENTUM_TS_MIN
        value: "0.50"
      - key: MOMENTUM_EMA_SPAN
        value: "480"
      - key: MOMENTUM_SL_R
        value: "1.0"
      - key: MOMENTUM_JUMP_TARGET_R
        value: "1.0"
      - key: MOMENTUM_RETRACE_R
        value: "0.25"
      - key: MOMENTUM_MAX_HOLD_BARS
        value: "12"
      - key: MOMENTUM_GATE_US100
        value: "vol"
      - key: MOMENTUM_GATE_THRESHOLD_US100
        value: "0.55"
      - key: MOMENTUM_GATE_JP225
        value: "vol"
      - key: MOMENTUM_GATE_THRESHOLD_JP225
        value: "0.55"
      - key: MOMENTUM_GATE_DE40
        value: "er"
      - key: MOMENTUM_GATE_THRESHOLD_DE40
        value: "0.35"
      - key: MOMENTUM_GATE_WINDOW
        value: "96"
      - key: MOMENTUM_REFRESH_SEC
        value: "60"
      - key: MOMENTUM_M1_HISTORY_BARS
        value: "8000"
      # ── Wave scalper — PER-PAIR swept values (OOS 2023-25 optimum) ──
      # Each pair gets its own entry/cut/profit/jump/trail via
      # WAVE_ENTRY_R_{SYM}, WAVE_CUT_R_{SYM}, ... (read by SYMBOL_WAVE_PARAMS
      # in config.py). Universal values helped some pairs and hurt others.
      - key: WAVE_ENTRY_R_XAUUSD
        value: "0.50"
      - key: WAVE_CUT_R_XAUUSD
        value: "0.01"
      - key: WAVE_PROFIT_R_XAUUSD
        value: "0.05"
      - key: WAVE_JUMP_BREAK_R_XAUUSD
        value: "1.0"
      - key: WAVE_JUMP_BODY_R_XAUUSD
        value: "0.50"
      - key: WAVE_TRAIL_R_XAUUSD
        value: "0.5"
      - key: WAVE_ENTRY_R_US100
        value: "0.50"
      - key: WAVE_CUT_R_US100
        value: "0.01"
      - key: WAVE_PROFIT_R_US100
        value: "0.05"
      - key: WAVE_JUMP_BREAK_R_US100
        value: "1.0"
      - key: WAVE_JUMP_BODY_R_US100
        value: "0.50"
      - key: WAVE_TRAIL_R_US100
        value: "0.5"
      - key: WAVE_ENTRY_R_JP225
        value: "0.50"
      - key: WAVE_CUT_R_JP225
        value: "0.01"
      - key: WAVE_PROFIT_R_JP225
        value: "0.05"
      - key: WAVE_JUMP_BREAK_R_JP225
        value: "1.0"
      - key: WAVE_JUMP_BODY_R_JP225
        value: "0.50"
      - key: WAVE_TRAIL_R_JP225
        value: "0.5"
      - key: WAVE_ENTRY_R_DE40
        value: "0.50"
      - key: WAVE_CUT_R_DE40
        value: "0.01"
      - key: WAVE_PROFIT_R_DE40
        value: "0.05"
      - key: WAVE_JUMP_BREAK_R_DE40
        value: "1.0"
      - key: WAVE_JUMP_BODY_R_DE40
        value: "0.50"
      - key: WAVE_TRAIL_R_DE40
        value: "0.5"
      - key: WAVE_ENTRY_R_US500
        value: "0.50"
      - key: WAVE_CUT_R_US500
        value: "0.01"
      - key: WAVE_PROFIT_R_US500
        value: "0.05"
      - key: WAVE_JUMP_BREAK_R_US500
        value: "1.0"
      - key: WAVE_JUMP_BODY_R_US500
        value: "0.50"
      - key: WAVE_TRAIL_R_US500
        value: "0.5"
      - key: WAVE_ENTRY_R_US30
        value: "0.50"
      - key: WAVE_CUT_R_US30
        value: "0.01"
      - key: WAVE_PROFIT_R_US30
        value: "0.05"
      - key: WAVE_JUMP_BREAK_R_US30
        value: "1.0"
      - key: WAVE_JUMP_BODY_R_US30
        value: "0.50"
      - key: WAVE_TRAIL_R_US30
        value: "0.5"
      # ── Wave scalper — DISABLED live (2026-08-11) ──
      # The wave's PF 4.17 was a legacy "level" fill artifact (fills at the
      # exact trigger level, impossible live). Under market fills (what the
      # live bot does, proven equal trade-for-trade to WaveScalper) it is a
      # LOSER: XAUUSD PF 0.53, net -286R. Wave disabled on all pairs.
      - key: WAVE_XAUUSD
        value: "false"
      - key: WAVE_US100
        value: "false"
      - key: WAVE_JP225
        value: "false"
      - key: WAVE_DE40
        value: "false"
      - key: WAVE_US500
        value: "false"
      - key: WAVE_US30
        value: "false"
      # ── Pull-into-H1 scalper — LIVE (daily profit bot) ──
      # The ONLY strategy that survived honest backtests (bar-close fills +
      # real costs from the start). Pull owns its symbols (wave + momentum
      # disabled there), the session filter is bypassed for pull signals
      # (trades freely like the backtest), and the daily guards lock in a
      # good day / stop the bleed (R in entry-H1-ATR units, UTC rollover).
      # Live on the 3 pairs that survived OOS 2026 at PF >= 1.3:
      #   US30   pull .3 / trail .35 / hold 24  PF train 1.73 valid 1.83 OOS 1.81
      #   XAUUSD pull .3 / trail .15 / hold 12  PF train 1.22 valid 1.96 OOS 1.40
      #   US100  pull .3 / trail .50 / hold 6   PF train 1.38 valid 1.86 OOS 1.34
      - key: PULL_XAUUSD
        value: "true"
      - key: PULL_US100
        value: "true"
      - key: PULL_US30
        value: "true"
      - key: PULL_PULL_R_XAUUSD
        value: "0.30"
      - key: PULL_TRAIL_R_XAUUSD
        value: "0.15"
      - key: PULL_MAX_HOLD_XAUUSD
        value: "12"
      - key: PULL_PULL_R_US100
        value: "0.30"
      - key: PULL_TRAIL_R_US100
        value: "0.50"
      - key: PULL_MAX_HOLD_US100
        value: "6"
      - key: PULL_PULL_R_US30
        value: "0.30"
      - key: PULL_TRAIL_R_US30
        value: "0.35"
      - key: PULL_MAX_HOLD_US30
        value: "24"
      - key: PULL_DAILY_TARGET_R_US30
        value: "3.0"
      - key: PULL_DAILY_MAX_LOSS_R_US30
        value: "2.5"
      # JP225/DE40/US500 are NOT enabled for pull (JP225 breaks even, DE40 has
      # no 2026 data, US500 marginal). Force CandleML off on them so NOTHING
      # trades there — wave+momentum are already false, only the legacy
      # CandleML fallback could still fire (bot.py:1123).
      - key: CANDLE_ML_MODE_JP225
        value: "off"
      - key: CANDLE_ML_MODE_DE40
        value: "off"
      - key: CANDLE_ML_MODE_US500
        value: "off"
      - key: USD_TO_NGN_RATE
        value: "1500"
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FAILOVER_ENABLED
        value: "true"
      - key: FAILOVER_ROLE
        value: "primary"
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: PYTHONMALLOC
        value: "malloc"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: MALLOC_TRIM_THRESHOLD
        value: "65536"
      - key: CORS_ORIGINS
        value: https://gold-scalper-qyhg.onrender.com
