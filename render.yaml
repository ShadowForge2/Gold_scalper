      # WAVE_ENTRY_R_{SYM}, WAVE_CUT_R_{SYM}, ... (read by SYMBOL_WAVE_PARAMS
      # in config.py). Universal values helped some pairs and hurt others.
      - key: WAVE_ENTRY_R_XAUUSD
        value: "0.50"
      - key: WAVE_CUT_R_XAUUSD
        value: "0.01"
      - key: WAVE_PROFIT_R_XAUUSD
