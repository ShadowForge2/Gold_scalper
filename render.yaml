      - key: WAVE_JUMP_BREAK_R_XAUUSD
        value: "1.0"
      - key: WAVE_JUMP_BODY_R_XAUUSD
        value: "0.50"
      - key: WAVE_TRAIL_R_XAUUSD
        value: "0.5"
